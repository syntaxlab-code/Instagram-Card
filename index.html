<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Card - Day 4 CSS</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
  <!-- Favicon-->
  <link rel="shortcut icon" href="syntaxlab logo.png" type="image/x-icon">
</head>
<body>

  <div class="container">

    <div class="card">

      <img class="profile-img" src="syntaxlab logo.png" alt="profile">

      <h2 class="name">SyntaxLab</h2>

      <div class="username">
        <i class="fa-brands fa-instagram"></i>
        @syntaxlab-code
      </div>

      <p class="bio">
      Learning Full Stack in 180 days 🚀
      From zero to developer🧠Join the journey
      📍I'm obsessed with programming💻.    
   </p>

     <button class="follow-btn">
     <i class="fa-solid fa-user"></i>
     Follow
    </button> 
    </div>

  </div>
</body>
</html>
